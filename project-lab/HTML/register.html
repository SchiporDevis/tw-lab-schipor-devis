<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrează-te</title>
    <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Înregistrează-te</h1>
            
            <form class="register-form" action="#" method="post" enctype="multipart/form-data">
                
                <div class="row">
                    <label for="username">Nume utilizator</label>
                    <input type="text" id="username" name="username" placeholder="ex: ioanaTW" required>
                </div>

                <!-- Email -->
                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="ex: ioana@uvt.ro" required>
                </div>

                <div class="row two-col">
                    <div>
                        <label for="password">Parolă</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm_password">Confirmă parola</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>

                <div class="row two-col">
                    <div>
                        <label for="dob">Data nașterii</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div>
                        <label for="country">Țara</label>
                        <select id="country" name="country" required>
                            <option value="">Alege țara...</option>
                            <option value="ro">România</option>
                            <option value="md">Republica Moldova</option>
                            <option value="uk">Marea Britanie</option>
                            <option value="us">SUA</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <label>Gen</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="m" required> Masculin</label>
                        <label><input type="radio" name="gender" value="f" required> Feminin</label>
                        <label><input type="radio" name="gender" value="o" required> Altul</label>
                    </div>
                </div>

                <div class="row">
                    <label>Interese</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" name="interests" value="frontend"> Front-end</label>
                        <label><input type="checkbox" name="interests" value="backend"> Back-end</label>
                        <label><input type="checkbox" name="interests" value="uiux"> UI/UX Design</label>
                        <label><input type="checkbox" name="interests" value="ai"> AI / ML</label>
                        <label><input type="checkbox" name="interests" value="cyber"> Securitate</label>
                        <label><input type="checkbox" name="interests" value="devops"> DevOps</label>
                    </div>
                </div>

                <div class="row">
                    <label for="profile_pic">Poză de profil</label>
                    <input type="file" id="profile_pic" name="profile_pic" accept="image/*">
                </div>

                <div class="row">
                    <label for="bio">Scurtă descriere</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Spune-ne câteva lucruri despre tine..."></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn primary">Înregistrează-mă</button>
                    <button type="reset" class="btn ghost">Resetează</button>
                </div>

                <p class="login-link">
                    Ai deja cont? <a href="login.html">Mergi la login</a>
                </p>

            </form>
        </section>
    </main>
</body>
</html>
